<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<style>:root{color-scheme:only light}</style>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Oyun Dünyası: küçük çocuklar için sesli yönlendirmeli oyunlar ve öğrenme uygulamaları.">
<meta name="theme-color" content="#2B2050">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-192.png">
<title>Oyun Dünyası</title>
<style>
:root{--ink:#2B2050;--muted:#7A6F8C;--sun:#FFC53D;--paper:#fff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(160deg,#FFE3F1,#E9DCFF 55%,#CFEFFF);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:16px}
main{margin:auto 0;width:min(440px,100%);background:var(--paper);border:4px solid var(--ink);border-radius:28px;padding:24px 20px;box-shadow:0 10px 0 rgba(43,32,80,.2);display:flex;flex-direction:column;gap:14px;text-align:center}
.simge{font-size:64px;line-height:1}
h1{margin:0;font-size:26px}
p{margin:0;font-weight:600;line-height:1.4}
.not{font-size:14px;color:var(--muted)}
button{min-height:56px;font:inherit;font-size:19px;font-weight:800;border:3px solid var(--ink);border-radius:18px;background:var(--sun);color:var(--ink);box-shadow:0 6px 0 rgba(43,32,80,.2);cursor:pointer;padding:0 20px}
button:active{transform:translateY(4px);box-shadow:none}
button.ikincil{background:#fff;font-size:17px;min-height:48px}
.cubuk{height:18px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#F3EFFC}
.cubuk i{display:block;height:100%;width:0;background:var(--sun);transition:width .2s}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="kutu" hidden>
  <div class="simge" id="simge">🎮</div>
  <h1 id="baslik">Oyun Dünyası</h1>
  <p id="aciklama">Oyunlar bu cihaza indiriliyor. Bu yalnızca ilk açılışta ve güncellemelerde olur.</p>
  <div class="cubuk" id="cubuk" hidden><i id="dolu"></i></div>
  <p class="not" id="durum" hidden></p>
  <button class="ikincil" id="yeniden" hidden>Yeniden dene</button>
  <button class="ikincil" id="eski" hidden>Eski sürümle devam et</button>
  <p class="not" style="font-size:11px;opacity:.6" id="kabuk">20261006-142619</p>
</main>
<script>
(async()=>{
'use strict';
const $=id=>document.getElementById(id);
const goster=(id,ac)=>{ $(id).hidden=!ac; };
/* ---------- device storage: the app itself, so it opens without internet ---------- */
const VT='oyun-dunyasi-kurulum', DEPO='depo';
const vtAc=()=>new Promise((res,rej)=>{ const r=indexedDB.open(VT,1); r.onupgradeneeded=()=>r.result.createObjectStore(DEPO); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const islem=async(mod,fn)=>{ const d=await vtAc(); return new Promise((res,rej)=>{ const t=d.transaction(DEPO,mod), q=fn(t.objectStore(DEPO)); t.oncomplete=()=>{ d.close(); res(q&&q.result); }; t.onerror=t.onabort=()=>{ d.close(); rej(t.error); }; }); };
const al=k=>islem('readonly',s=>s.get(k)).catch(()=>undefined);
const koy=(k,v)=>islem('readwrite',s=>s.put(v,k));

/* ---------- run the app in this page, at this address ---------- */
function calistir(html){
  const ek='<scr'+'ipt>window.OYUN_WEB=true</scr'+'ipt><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2B2050"><link rel="apple-touch-icon" href="ikon-192.png">';
  html=html.replace('<head>','<head>'+ek);
  document.open(); document.write(html); document.close();
}

/* ---------- download with progress; the file is "OYN0" followed by the gzipped app ---------- */
async function indir(){
  goster('cubuk',true); goster('durum',true); $('durum').textContent='İndiriliyor…';
  const r=await fetch('uygulama.bin?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('ag');
  const toplam=+r.headers.get('content-length')||0, okur=r.body.getReader(), parcalar=[]; let n=0;
  for(;;){ const {done,value}=await okur.read(); if(done) break; parcalar.push(value); n+=value.length;
    $('dolu').style.width=(toplam?Math.min(100,n/toplam*100):50)+'%';
    $('durum').textContent='İndiriliyor… '+(n/1048576).toFixed(1)+(toplam?' / '+(toplam/1048576).toFixed(1):'')+' MB'; }
  const b=new Uint8Array(n); let o=0; for(const p of parcalar){ b.set(p,o); o+=p.length; }
  if(b.length<100||String.fromCharCode(b[0],b[1],b[2],b[3])!=='OYN0') throw new Error('bicim');
  $('durum').textContent='Kuruluyor…';
  return await new Response(new Blob([b.subarray(4)]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

function ekran(simge,baslik,aciklama){ $('simge').textContent=simge; $('baslik').textContent=baslik; $('aciklama').textContent=aciklama;
  ['cubuk','durum','yeniden','eski'].forEach(id=>goster(id,false)); goster('kutu',true); }

async function kur(eski,guncelleme){
  ekran(guncelleme?'⬇️':'🎮',guncelleme?'Güncelleniyor':'Oyun Dünyası',guncelleme?'Yeni sürüm indiriliyor. Yapılan oyunlar ve ayarlar silinmez.':'Oyunlar bu cihaza indiriliyor. Bu yalnızca ilk açılışta ve güncellemelerde olur.');
  try{
    const html=await indir();
    await koy('uygulama',{html,zaman:Date.now()});
    try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(_){}
    calistir(html);
  }catch(err){
    ekran('⚠️',guncelleme?'Güncellenemedi':'İndirilemedi',err&&err.name==='QuotaExceededError'?'Bu cihazda yeterli yer yok.':'İnternet bağlantısını kontrol edip yeniden deneyin.');
    goster('yeniden',true); $('yeniden').onclick=()=>kur(eski,guncelleme);
    if(eski){ goster('eski',true); $('eski').onclick=()=>calistir(eski.html); }
  }
}

/* ---------- start ---------- */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
if(!window.indexedDB||typeof DecompressionStream!=='function'){
  ekran('⚠️','Bu tarayıcı uygun değil','Uygulama güncel bir Chrome, Edge ya da Safari ile açılır.'); return;
}
const istenen=new URLSearchParams(location.search).has('guncelle');
if(location.search){ try{ history.replaceState(null,'',location.pathname); }catch(e){} }
const kayit=await al('uygulama');
if(kayit&&kayit.html&&!istenen){ calistir(kayit.html); return; }
kur(kayit&&kayit.html?kayit:null,!!(kayit&&kayit.html));
})();
</script>
</body>
</html>
